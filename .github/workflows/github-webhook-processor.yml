name: GitHub webhook processing regression tests

on:
  pull_request:
    paths:
      - 'src/lib/services/githubWebhookProcessor.ts'
      - 'tests/github-webhook-processor.test.mjs'
      - 'tests/helpers/load-typescript.mjs'
      - '.github/workflows/github-webhook-processor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Run isolated processor regression tests
        run: node --experimental-vm-modules --test tests/github-webhook-processor.test.mjs
